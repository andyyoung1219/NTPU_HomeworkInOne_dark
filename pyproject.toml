[project]
name = "ntpu-homework-in-one-dark"
version = "0.5.0rc1"
description = "Local learning dashboard, course search, recoverable homework and reviewed exports"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "pymupdf>=1.25,<2",
  "python-docx>=1.1,<2",
  "lxml>=6.1.3,<7",
  "reportlab>=4.4,<5",
  "fonttools>=4.60,<5",
  "langgraph>=1.0,<2",
  "jsonschema>=4.23,<5",
  "rapidocr>=3,<4",
  "onnxruntime>=1.20,<2",
  "latex2mathml>=3.78,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "gradio>=6.31,<7"]

[tool.uv]
# Gradio is retained only for historical callback regression tests in dev.
# Its Pillow cap must not downgrade the document/image runtime.
override-dependencies = ["pillow>=13.0.0,<14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
