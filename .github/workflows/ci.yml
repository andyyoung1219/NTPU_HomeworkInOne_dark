name: Local MVP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  p3-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Prepare locked runtime and upstream parser
        run: |
          uv sync --locked
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          source = json.loads(Path('docs/sources.lock.json').read_text())['sources']['NTPUOne']
          subprocess.run(['git', 'clone', source['url'], source['path']], check=True)
          subprocess.run(['git', '-C', source['path'], 'checkout', '--detach', source['commit']], check=True)
          PY
      - name: Build isolated runner
        run: uv run python scripts/setup_runner.py
      - name: Real isolation and repeated task gate (synthetic AI)
        env:
          NTPU_TEST_RUNNER: '1'
        run: uv run python scripts/validate_p3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-sandbox-gate
          path: .local/p3/validation.json
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.7.21'
      - name: Set up pinned sources and local dependencies
        shell: pwsh
        run: ./scripts/setup_dev.ps1
      - name: Test synthetic fixtures only
        shell: pwsh
        run: |
          .venv/Scripts/ruff.exe check backend frontend tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe scripts/check_repository.py
      - name: Upstream browser contracts
        working-directory: .upstream/ntpu-ai-vscode
        shell: pwsh
        run: |
          $env:NODE_PATH = (Resolve-Path ../../ntpu-ai-bridge/node_modules).Path
          node --test test/browser-auth.test.js test/browser-manager.test.js test/browser-observer.test.js
      - name: Runtime dependency audit
        shell: pwsh
        run: |
          uv pip freeze --python .venv/Scripts/python.exe > audit-requirements.txt
          uvx pip-audit -r audit-requirements.txt --no-deps --disable-pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix ntpu-ai-bridge audit --omit=dev --audit-level=low
